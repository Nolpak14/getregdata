# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    properties:
      apifyToken:
        type: string
        title: Apify API Token
        description: Apify API token (free tier with credits at console.apify.com). Needed for registry tool calls; listing tools works without it.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({ command: 'npx', args: ['-y', 'getregdata-mcp'], env: config.apifyToken ? { APIFY_TOKEN: config.apifyToken } : {} })
